# 所有实验参数集中配置；凭据只从环境变量或显式 .env 加载。
[paths]
data_dir = "datas"
output_dir = "artifacts"
contracts_file = "future_contract.pkl"

[environment]
lookback = 750
short_window = 5
long_window = 20
spread_lags = 5
hedge_refresh_days = 180
commission_per_leg = 0.25
bollinger_width = 2.0
numerical_epsilon = 1e-8

[network]
hidden_sizes = [60, 120, 60, 30, 10]
activation = "relu"

[agent]
device = "auto"
gamma = 0.90
learning_rate = 0.00001
epsilon_start = 1.0
epsilon_end = 1e-9
epsilon_decay = 4000.0
batch_size = 64
replay_capacity = 10000
gradient_clip = 10.0

[training]
seed = 41
episodes = 100
target_update_episodes = 10
patience = 20
min_improvement = 0.0

[walk_forward]
train_size = 940
validation_size = 60
test_size = 120
significance = 0.05

[backtest]
initial_cash = 20000.0
commission_per_contract = 1.2
base_quantity = 1.0
liquidate_at_end = true
annualization = 252
risk_free_rate = 0.0

[research]
primary_pair = ["CS", "C"]
run_walk_forward = false

# multiplier=1 和允许小数头寸延续旧研究口径，不代表真实交易所合约规格。
